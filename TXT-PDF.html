<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>PDF Creator</title>
  <script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #f3f4f6;
      color: #1f2937;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    header {
      background: #111827;
      color: #fff;
      padding: 1rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-shrink: 0;
    }
    header h1 { font-size: 1.25rem; font-weight: 600; flex-shrink: 0; }
    .header-right {
      display: flex;
      align-items: center;
      gap: 5px;
      width: 50%;
      flex-shrink: 0;
    }
    .filename-display {
      flex: 1;
      min-width: 0;
      font-family: 'Courier New', Courier, monospace;
      font-size: 0.9rem;
      color: #111827;
      background: #fff;
      padding: 0.4rem 0.6rem;
      border-radius: 0.375rem;
      border: 1px solid #d1d5db;
      white-space: nowrap;
      letter-spacing: 0.02em;
      text-align: left;
      outline: none;
      cursor: text;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .filename-display:focus {
      border-color: #3b82f6;
      box-shadow: 0 0 0 3px rgba(59,130,246,0.15);
    }
    button#generateBtn {
      background: #10b981;
      color: #fff;
      border: none;
      padding: 0.6rem 1.4rem;
      border-radius: 0.375rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
      flex-shrink: 0;
    }
    button#generateBtn:hover { background: #059669; }
    button#generateBtn:disabled { background: #6b7280; cursor: not-allowed; }
    .main {
      display: flex;
      flex: 1;
      overflow: hidden;
    }
    .sidebar {
      width: 50%;
      background: #fff;
      border-right: 1px solid #e5e7eb;
      display: flex;
      flex-direction: column;
      overflow-y: auto;
    }
    .panel {
      padding: 1.25rem;
      border-bottom: 1px solid #e5e7eb;
    }
    .panel h3 {
      font-size: 0.875rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #6b7280;
      margin-bottom: 0.75rem;
    }
    .dropzone {
      border: 2px dashed #d1d5db;
      border-radius: 0.5rem;
      padding: 1.5rem;
      text-align: center;
      color: #6b7280;
      cursor: pointer;
      transition: border-color 0.2s, background 0.2s;
    }
    .dropzone:hover, .dropzone.dragover {
      border-color: #10b981;
      background: #ecfdf5;
    }
    #fileInput { display: none; }
    .chat-history {
      flex: 1;
      overflow-y: auto;
      padding: 1rem;
      background: #f9fafb;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      min-height: 120px;
    }
    .chat-bubble {
      background: #fff;
      border: 1px solid #e5e7eb;
      border-radius: 0.5rem;
      padding: 0.6rem 0.8rem;
      font-size: 0.875rem;
      max-width: 90%;
      word-break: break-word;
      align-self: flex-start;
    }
    .chat-bubble .bubble-label {
      font-size: 0.7rem;
      font-weight: 700;
      color: #3b82f6;
      text-transform: uppercase;
      letter-spacing: 0.03em;
      margin-bottom: 0.25rem;
    }
    .chat-bubble img {
      max-width: 100%;
      border-radius: 0.25rem;
      margin-top: 0.25rem;
    }
    .chat-input {
      display: flex;
      gap: 0.5rem;
      padding: 1rem;
      border-top: 1px solid #e5e7eb;
      background: #fff;
    }
    .chat-input textarea {
      flex: 1;
      resize: vertical;
      border: 1px solid #d1d5db;
      border-radius: 0.375rem;
      padding: 0.5rem;
      font-family: inherit;
      font-size: 0.875rem;
      height: 200px;
    }
    .chat-input button {
      background: #3b82f6;
      color: #fff;
      border: none;
      padding: 0 1rem;
      border-radius: 0.375rem;
      font-weight: 600;
      cursor: pointer;
    }
    .chat-input button:hover { background: #2563eb; }
    .builder {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      padding: 1.5rem;
    }
    .builder h3 {
      font-size: 0.875rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #6b7280;
      margin-bottom: 0.75rem;
    }
    .item-list {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }
    .item-card {
      background: #fff;
      border: 1px solid #e5e7eb;
      border-radius: 0.5rem;
      padding: 0.75rem;
      display: flex;
      align-items: center;
      gap: 0.75rem;
      cursor: grab;
      transition: box-shadow 0.2s, transform 0.1s;
    }
    .item-card.dragging {
      opacity: 0.5;
      box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1);
    }
    .item-card:hover {
      box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
    }
    .drag-handle {
      color: #9ca3af;
      cursor: grab;
      font-size: 1.1rem;
      user-select: none;
      padding: 0 0.25rem;
    }
    .include-check {
      width: 1.1rem;
      height: 1.1rem;
      cursor: pointer;
      accent-color: #10b981;
    }
    .preview {
      width: 70px;
      height: 70px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f3f4f6;
      border-radius: 0.375rem;
      overflow: hidden;
      font-size: 0.75rem;
      color: #6b7280;
    }
    .preview img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
    }
    .pdf-icon {
      font-weight: 700;
      color: #ef4444;
    }
    .text-preview {
      font-size: 0.7rem;
      line-height: 1.2;
      overflow: hidden;
      display: -webkit-box;
      -webkit-line-clamp: 4;
      -webkit-box-orient: vertical;
      padding: 0.25rem;
    }
    .details {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
      min-width: 0;
    }
    .name {
      font-weight: 600;
      font-size: 0.875rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .controls {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
    }
    .controls select {
      font-size: 0.8rem;
      padding: 0.2rem 0.4rem;
      border: 1px solid #d1d5db;
      border-radius: 0.25rem;
      background: #fff;
      cursor: pointer;
    }
    .remove-btn {
      background: transparent;
      border: none;
      color: #9ca3af;
      font-size: 1.25rem;
      cursor: pointer;
      line-height: 1;
      padding: 0.25rem;
    }
    .remove-btn:hover { color: #ef4444; }
    .badge {
      font-size: 0.7rem;
      padding: 0.15rem 0.4rem;
      border-radius: 9999px;
      background: #e5e7eb;
      color: #374151;
      font-weight: 600;
      white-space: nowrap;
    }
    .empty-state {
      text-align: center;
      color: #9ca3af;
      padding: 3rem;
      font-size: 0.875rem;
    }
  </style>
</head>
<body>

<header>
  <h1>📄 PDF Creator</h1>
  <div class="header-right">
    <input type="text" class="filename-display" id="filenameDisplay" spellcheck="false" autocomplete="off">
    <button id="generateBtn">GENERATE PDF</button>
  </div>
</header>

<div class="main">
  <div class="sidebar">
    <div class="panel">
      <h3>Upload Files</h3>
      <div class="dropzone" id="dropzone">
        Drop PDF, TXT, or images here<br>
        <small>or click to browse</small>
      </div>
      <input type="file" id="fileInput" multiple accept=".pdf,.txt,image/*">
    </div>
    <div class="panel" style="flex:1; display:flex; flex-direction:column; padding:0; border-bottom:none;">
      <h3 style="padding:1.25rem 1.25rem 0;">Pasted Input</h3>
      <div class="chat-history" id="chatHistory">
        <div class="empty-state" id="chatEmpty">Type text or paste an image below</div>
      </div>
      <div class="chat-input">
        <textarea id="textInput" placeholder="Type text, then click Add… (Ctrl+V to paste image)"></textarea>
        <button id="addTextBtn">Add</button>
      </div>
    </div>
  </div>

  <div class="builder">
    <h3>Pages & Arrangement</h3>
    <div class="item-list" id="itemList">
      <div class="empty-state">Upload files or add text to get started</div>
    </div>
  </div>
</div>

<script>
  const { PDFDocument, StandardFonts } = PDFLib;

  let items = [];
  let textCounter = 1;
  let fileCounter = 1;
  const margin = 36;

  const pageSizes = {
    '8.5x11': { width: 612, height: 792 },
    '11x17': { width: 792, height: 1224 }
  };

  function getDims(size, orientation) {
    const s = pageSizes[size];
    return orientation === 'landscape'
      ? { width: s.height, height: s.width }
      : { width: s.width, height: s.height };
  }

  // --- Filename Generator ---
  let seqNum = 1;
  let lastMinuteKey = '';
  let displayedMinuteKey = '';
  let userEditedFilename = false;
  const filenameInput = document.getElementById('filenameDisplay');

  function pad(n) { return String(n).padStart(2, '0'); }

  function getAutoFilename() {
    const now = new Date();
    const minuteKey = `${now.getFullYear()}${pad(now.getMonth()+1)}${pad(now.getDate())}${pad(now.getHours())}${pad(now.getMinutes())}`;
    if (minuteKey !== lastMinuteKey) { lastMinuteKey = minuteKey; seqNum = 1; }
    const formatted = `${now.getFullYear()}${pad(now.getMonth()+1)}${pad(now.getDate())}-${pad(now.getHours())}${pad(now.getMinutes())}`;
    return `${formatted} PDFCreator${String(seqNum).padStart(3, '0')}.PDF`;
  }

  function updateFilenameDisplay(force = false) {
    const now = new Date();
    const currentKey = `${now.getFullYear()}${pad(now.getMonth()+1)}${pad(now.getDate())}${pad(now.getHours())}${pad(now.getMinutes())}`;
    if (force || currentKey !== displayedMinuteKey) {
      if (document.activeElement !== filenameInput && !userEditedFilename) {
        filenameInput.value = getAutoFilename();
        displayedMinuteKey = currentKey;
      }
    }
  }

  filenameInput.addEventListener('input', () => { userEditedFilename = true; });

  setInterval(() => updateFilenameDisplay(), 2000);
  updateFilenameDisplay(true);

  // --- File Processing ---
  async function processFile(file) {
    if (file.type === 'application/pdf') {
      addItem({ type: 'pdf', name: 'FILE ' + fileCounter++, data: await file.arrayBuffer(), pageSize: '8.5x11', orientation: 'portrait', included: true });
    } else if (file.type.startsWith('image/')) {
      await processImageFile(file);
    } else if (file.type === 'text/plain' || file.name.endsWith('.txt')) {
      addItem({ type: 'text', name: 'FILE ' + fileCounter++, content: await file.text(), pageSize: '8.5x11', orientation: 'portrait', included: true });
    } else {
      alert('Unsupported file type: ' + file.name);
    }
  }

  // --- DOWNSCALING IMPLEMENTED HERE ---
  async function processImageFile(file, customName) {
    const name = customName || ('FILE ' + fileCounter++);
    
    // Set max dimensions for performance and memory constraints
    const MAX_WIDTH = 1600;
    const MAX_HEIGHT = 1600;

    const url = URL.createObjectURL(file);
    const img = new Image();
    img.src = url;
    
    await new Promise((resolve, reject) => {
      img.onload = resolve;
      img.onerror = reject;
    });

    let width = img.width;
    let height = img.height;

    // Calculate the new dimensions keeping aspect ratio
    if (width > MAX_WIDTH || height > MAX_HEIGHT) {
      if (width > height) {
        height = Math.round((height * MAX_WIDTH) / width);
        width = MAX_WIDTH;
      } else {
        width = Math.round((width * MAX_HEIGHT) / height);
        height = MAX_HEIGHT;
      }
    }

    const canvas = document.createElement('canvas');
    canvas.width = width;
    canvas.height = height;
    
    // Draw onto canvas at the potentially reduced scale
    const ctx = canvas.getContext('2d');
    ctx.drawImage(img, 0, 0, width, height);

    // Default to JPG for space savings, unless it's explicitly a PNG 
    // to preserve potential transparency
    const outputType = file.type === 'image/png' ? 'image/png' : 'image/jpeg';
    const quality = outputType === 'image/jpeg' ? 0.85 : undefined;

    const blob = await new Promise(resolve => canvas.toBlob(resolve, outputType, quality));

    addItem({
      type: 'image', 
      name,
      data: new Uint8Array(await blob.arrayBuffer()),
      imageType: outputType === 'image/jpeg' ? 'jpg' : 'png',
      pageSize: '8.5x11', 
      orientation: 'portrait', 
      included: true
    });
    
    URL.revokeObjectURL(url);
  }

  // --- Upload Handling ---
  const dropzone = document.getElementById('dropzone');
  const fileInput = document.getElementById('fileInput');

  dropzone.addEventListener('click', () => fileInput.click());
  dropzone.addEventListener('dragover', e => { e.preventDefault(); dropzone.classList.add('dragover'); });
  dropzone.addEventListener('dragleave', () => dropzone.classList.remove('dragover'));
  dropzone.addEventListener('drop', e => {
    e.preventDefault();
    dropzone.classList.remove('dragover');
    Array.from(e.dataTransfer.files).forEach(processFile);
  });
  fileInput.addEventListener('change', e => Array.from(e.target.files).forEach(processFile));

  // --- Chat / Text Input ---
  const textInput = document.getElementById('textInput');
  const addTextBtn = document.getElementById('addTextBtn');
  const chatHistory = document.getElementById('chatHistory');

  addTextBtn.addEventListener('click', () => {
    const text = textInput.value.trim();
    if (!text) return;
    const label = 'INPUT ' + textCounter++;
    addItem({ type: 'text', name: label, content: text, pageSize: '8.5x11', orientation: 'portrait', included: true });
    addChatBubble(label, text, null);
    textInput.value = '';
  });

  document.addEventListener('paste', async e => {
    for (const item of e.clipboardData.items) {
      if (item.type.startsWith('image/')) {
        const file = item.getAsFile();
        if (file) {
          const label = 'FILE ' + fileCounter++;
          await processImageFile(file, label);
          addChatBubble(label, null, URL.createObjectURL(file));
        }
      }
    }
  });

  function addChatBubble(label, text, imgUrl) {
    const empty = chatHistory.querySelector('#chatEmpty');
    if (empty) empty.remove();
    const div = document.createElement('div');
    div.className = 'chat-bubble';
    div.innerHTML = `<div class="bubble-label">${label}</div>`;
    if (text) {
      const span = document.createElement('span');
      span.textContent = text;
      div.appendChild(span);
    }
    if (imgUrl) {
      const img = document.createElement('img');
      img.src = imgUrl;
      div.appendChild(img);
    }
    chatHistory.appendChild(div);
    chatHistory.scrollTop = chatHistory.scrollHeight;
  }

  // --- Item Management ---
  function addItem(item) {
    if (item.type === 'image') {
      const blob = new Blob([item.data], { type: item.imageType === 'jpg' ? 'image/jpeg' : 'image/png' });
      item.objectUrl = URL.createObjectURL(blob);
    }
    items.push(item);
    renderItems();
  }

  const itemList = document.getElementById('itemList');

  itemList.addEventListener('change', e => {
    const card = e.target.closest('.item-card');
    if (!card) return;
    const item = items[+card.dataset.index];
    if (e.target.classList.contains('include-check')) item.included = e.target.checked;
    if (e.target.classList.contains('page-size')) item.pageSize = e.target.value;
    if (e.target.classList.contains('orientation')) item.orientation = e.target.value;
  });

  itemList.addEventListener('click', e => {
    if (!e.target.classList.contains('remove-btn')) return;
    const card = e.target.closest('.item-card');
    const idx = +card.dataset.index;
    if (items[idx].objectUrl) URL.revokeObjectURL(items[idx].objectUrl);
    items.splice(idx, 1);
    renderItems();
  });

  itemList.addEventListener('dragover', e => e.preventDefault());
  itemList.addEventListener('drop', e => {
    e.preventDefault();
    const from = +e.dataTransfer.getData('text/plain');
    const card = e.target.closest('.item-card');
    const to = card ? +card.dataset.index : items.length;
    if (from === to) return;
    const [moved] = items.splice(from, 1);
    items.splice(to, 0, moved);
    renderItems();
  });

  function renderItems() {
    itemList.innerHTML = '';
    if (!items.length) {
      itemList.innerHTML = '<div class="empty-state">Upload files or add text to get started</div>';
      return;
    }
    const frag = document.createDocumentFragment();
    items.forEach((item, index) => {
      const card = document.createElement('div');
      card.className = 'item-card';
      card.draggable = true;
      card.dataset.index = index;

      card.addEventListener('dragstart', e => {
        e.dataTransfer.setData('text/plain', index);
        card.classList.add('dragging');
      });
      card.addEventListener('dragend', () => card.classList.remove('dragging'));

      let previewHtml = '';
      if (item.type === 'image') {
        previewHtml = `<img src="${item.objectUrl}" alt="">`;
      } else if (item.type === 'pdf') {
        previewHtml = `<div class="pdf-icon">PDF</div>`;
      } else {
        const snippet = item.content.replace(/\n/g, ' ').substring(0, 80) + (item.content.length > 80 ? '…' : '');
        previewHtml = `<div class="text-preview">${snippet}</div>`;
      }

      card.innerHTML = `
        <div class="drag-handle">☰</div>
        <input type="checkbox" class="include-check" title="Include in PDF" ${item.included ? 'checked' : ''}>
        <div class="preview">${previewHtml}</div>
        <div class="details">
          <div class="name" title="${item.name}">${item.name}</div>
          <div class="controls">
            <select class="page-size">
              <option value="8.5x11" ${item.pageSize === '8.5x11' ? 'selected' : ''}>8.5×11</option>
              <option value="11x17" ${item.pageSize === '11x17' ? 'selected' : ''}>11×17</option>
            </select>
            <select class="orientation">
              <option value="portrait" ${item.orientation === 'portrait' ? 'selected' : ''}>Portrait</option>
              <option value="landscape" ${item.orientation === 'landscape' ? 'selected' : ''}>Landscape</option>
            </select>
            <span class="badge">${item.type.toUpperCase()}</span>
          </div>
        </div>
        <button class="remove-btn" title="Remove">×</button>
      `;
      frag.appendChild(card);
    });
    itemList.appendChild(frag);
  }

  // --- Font Caching ---
  let cachedFontBytes = null;
  async function getUnicodeFont(pdfDoc) {
    if (cachedFontBytes === null) {
      try {
        const res = await fetch('https://cdn.jsdelivr.net/gh/google/fonts@main/apache/roboto/static/Roboto-Regular.ttf');
        cachedFontBytes = res.ok ? await res.arrayBuffer() : false;
      } catch {
        cachedFontBytes = false;
      }
    }
    if (cachedFontBytes) return pdfDoc.embedFont(cachedFontBytes);
    return null;
  }

  // --- PDF Generation ---
  document.getElementById('generateBtn').addEventListener('click', async () => {
    const included = items.filter(i => i.included);
    if (!included.length) {
      alert('Please include at least one item.');
      return;
    }

    const btn = document.getElementById('generateBtn');
    const originalText = btn.textContent;
    btn.disabled = true;
    btn.textContent = 'Working…';

    try {
      const pdfDoc = await PDFDocument.create();
      const standardFont = await pdfDoc.embedFont(StandardFonts.Helvetica);
      const textFont = (await getUnicodeFont(pdfDoc)) || standardFont;

      for (const item of included) {
        const dims = getDims(item.pageSize, item.orientation);

        if (item.type === 'pdf') {
          const srcDoc = await PDFDocument.load(item.data);
          for (const srcPage of srcDoc.getPages()) {
            const embedded = await pdfDoc.embedPage(srcPage);
            const newPage = pdfDoc.addPage([dims.width, dims.height]);
            const srcSize = srcPage.getSize();
            const maxW = dims.width - 2 * margin;
            const maxH = dims.height - 2 * margin;
            const scale = Math.min(maxW / srcSize.width, maxH / srcSize.height, 1);
            const drawW = srcSize.width * scale;
            const drawH = srcSize.height * scale;
            newPage.drawPage(embedded, {
              x: (dims.width - drawW) / 2,
              y: (dims.height - drawH) / 2,
              width: drawW, height: drawH
            });
          }
        }

        else if (item.type === 'image') {
          const img = item.imageType === 'jpg'
            ? await pdfDoc.embedJpg(item.data)
            : await pdfDoc.embedPng(item.data);
          const newPage = pdfDoc.addPage([dims.width, dims.height]);
          const imgSize = img.size;
          const maxW = dims.width - 2 * margin;
          const maxH = dims.height - 2 * margin;
          const scale = Math.min(maxW / imgSize.width, maxH / imgSize.height, 1);
          const drawW = imgSize.width * scale;
          const drawH = imgSize.height * scale;
          newPage.drawImage(img, {
            x: (dims.width - drawW) / 2,
            y: (dims.height - drawH) / 2,
            width: drawW, height: drawH
          });
        }

        else if (item.type === 'text') {
          const fontSize = 12;
          const lineHeight = fontSize * 1.35;
          const maxW = dims.width - 2 * margin;
          const maxH = dims.height - 2 * margin;
          let content = item.content;
          if (!textFont.embeddedName || textFont.embeddedName === 'Helvetica') {
            content = content.replace(/[^\x00-\xFF]/g, '');
          }
          const lines = wrapText(content, maxW, fontSize, textFont);
          const linesPerPage = Math.floor(maxH / lineHeight);

          for (let i = 0; i < lines.length; i += linesPerPage) {
            const newPage = pdfDoc.addPage([dims.width, dims.height]);
            let y = dims.height - margin - fontSize;
            for (const line of lines.slice(i, i + linesPerPage)) {
              newPage.drawText(line, { x: margin, y, size: fontSize, font: textFont });
              y -= lineHeight;
            }
          }
        }
      }

      const pdfBytes = await pdfDoc.save();
      const blob = new Blob([pdfBytes], { type: 'application/pdf' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = filenameInput.value.trim() || getAutoFilename();
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);

      seqNum++;
      userEditedFilename = false;
      updateFilenameDisplay(true);

    } catch (err) {
      console.error(err);
      alert('Error generating PDF: ' + err.message);
    } finally {
      btn.disabled = false;
      btn.textContent = originalText;
    }
  });

  function wrapText(text, maxWidth, fontSize, font) {
    return text.split('\n').flatMap(para => {
      if (!para.trim()) return [''];
      const words = para.split(/\s+/).filter(Boolean);
      if (!words.length) return [''];
      const lines = [];
      let current = words[0];
      for (let i = 1; i < words.length; i++) {
        const test = current + ' ' + words[i];
        if (font.widthOfTextAtSize(test, fontSize) > maxWidth) {
          lines.push(current);
          current = words[i];
        } else {
          current = test;
        }
      }
      lines.push(current);
      return lines;
    });
  }
</script>
