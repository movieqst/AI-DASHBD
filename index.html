<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI-DASHBD</title>

<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    background: #0a0e1a;
    color: #c9d1d9;
    min-height: 100vh;
    padding-bottom: 40px;
}

/* AFFILIATE NOTICE */
.affiliate-notice {
    text-align: center;
    padding: 8px 16px;
    background: #0d1117;
    border-bottom: 1px solid #1c2128;
    font-size: 14.3px;
    color: #8b949e;
    letter-spacing: 0.3px;
}
.affiliate-notice .notice-word {
    font-size: 16.9px;
    font-weight: 700;
    color: #ff6b6b;
    text-decoration: underline;
    text-underline-offset: 2px;
}

/* NAVIGATION */
.top-nav {
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 6px;
    padding: 12px 16px;
    background: #0d1117;
    border-bottom: 1px solid #1c2128;
    position: sticky;
    top: 0;
    z-index: 100;
}
.nav-tab {
    padding: 6px 14px;
    border-radius: 6px;
    font-size: 1.01rem;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s ease;
    border: 1px solid transparent;
    background: transparent;
    text-transform: uppercase;
    letter-spacing: 0.4px;
    display: flex;
    align-items: center;
    gap: 5px;
}
.nav-tab:hover { transform: translateY(-1px); }
.nav-tab.active { border-color: currentColor; box-shadow: 0 0 10px currentColor; }

/* CATEGORY COLORS */
.tab-all { color: #ff4444; }
.tab-chat { color: #58a6ff; }
.tab-image { color: #f0883e; }
.tab-audio { color: #a371f7; }
.tab-video { color: #39c5cf; }
.tab-code { color: #3fb950; }
.tab-supercomputer { color: #ff2d78; }
.tab-niche { color: #d29922; }
.tab-notai { color: #8b949e; }
.tab-txtspeech { color: #ff9bce; }

/* NEW GIF HEADER */
.header-container {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 25px;
    padding: 25px 20px 10px;
}
.logo-gif {
    width: 140px;
    height: auto;
}
.title-block {
    display: flex;
    flex-direction: column;
    justify-content: center;
}
.main-title {
    font-size: 2.08rem;
    font-weight: 700;
    color: #e6edf3;
    letter-spacing: 3px;
    text-transform: uppercase;
}
.subtitle {
    font-size: 1.82rem;
    color: #ff6b6b;
    letter-spacing: 6px;
    text-transform: uppercase;
    margin-top: 4px;
    font-weight: 600;
}

/* SEARCH BAR */
.search-bar {
    max-width: 500px;
    margin: 0 auto 20px;
    padding: 0 20px;
}
.search-bar input {
    width: 100%;
    padding: 10px 16px;
    border-radius: 8px;
    border: 1px solid #1c2128;
    background: #0d1117;
    color: #c9d1d9;
    font-size: 1.17rem;
    outline: none;
}
.search-bar input:focus { border-color: #58a6ff; }
