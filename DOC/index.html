<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <template id="__bundler_thumbnail" data-bg-color="#f2f2f3">
    <svg viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg">
      <rect x="380" y="60" width="440" height="680" fill="#ffffff" stroke="#5980a6" stroke-width="6"/>
      <line x1="420" y1="160" x2="740" y2="160" stroke="#5980a6" stroke-width="8"/>
      <line x1="420" y1="220" x2="740" y2="220" stroke="#ccc" stroke-width="6"/>
      <line x1="420" y1="270" x2="740" y2="270" stroke="#ccc" stroke-width="6"/>
      <rect x="420" y="330" width="200" height="140" fill="none" stroke="#5980a6" stroke-width="6"/>
    </svg>
  </template>
  <link rel="stylesheet" href="_ds/industry-d2fd2168-52fe-46e0-884d-4a7d5e106dde/styles.css">
  <script src="_ds/industry-d2fd2168-52fe-46e0-884d-4a7d5e106dde/_ds_bundle.js"></script>
  <script src="./doc-page.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <style id="__om-edit-overrides"></style>
  <style>
    doc-page:not(:defined){visibility:hidden}
    html,body{margin:0;background:var(--color-neutral-200,#e6e6e7);}
    @media print { .no-print{display:none !important;} }
    .editable:focus{outline:2px solid var(--color-accent,#5980a6);outline-offset:-2px;}
    .editable img{max-width:100%;}
    body, button, input, .btn, .seg-opt{font-family:'Arial Narrow', Arial, sans-serif !important;}
    .btn, .seg-opt, .page-title{text-transform:uppercase;}
  </style>
</helmet>

<div class="no-print" style="position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:var(--space-4,16px);flex-wrap:wrap;padding:var(--space-3,12px) var(--space-5,20px);background:var(--color-bg,#f2f2f3);border-bottom:1px solid var(--color-neutral-300,#ccc);">
  <input
    class="page-title"
    value="{{ docTitleValue }}"
    placeholder="DOC"
    onChange="{{ onDocTitleChange }}"
    style="width:90px;text-align:center;border:1px solid var(--color-neutral-300,#ccc);border-radius:var(--radius-sm,4px);outline:none;font-family:'Arial Narrow', Arial, sans-serif;font-size:16px;background:#ffffff;color:var(--color-text,#1d1f20);padding:4px 6px;"
  ></input>

  <div class="seg" style="display:flex;">
    <button class="seg-opt" style="{{ sizeLetterStyle }}" onClick="{{ setSizeLetter }}">Letter 8.5×11</button>
    <button class="seg-opt" style="{{ sizeTabloidStyle }}" onClick="{{ setSizeTabloid }}">Tabloid 11×17</button>
  </div>

  <div class="seg" style="display:flex;">
    <button class="seg-opt" style="{{ orientPortraitStyle }}" onClick="{{ setOrientationPortrait }}">Portrait</button>
    <button class="seg-opt" style="{{ orientLandscapeStyle }}" onClick="{{ setOrientationLandscape }}">Landscape</button>
  </div>

  <span style="flex:1;"></span>

  <input type="file" accept="image/*,application/pdf" style="display:none;" ref="{{ fileInputRef }}" onChange="{{ onFileChosen }}"></input>
  <button
    class="btn btn-secondary"
    onClick="{{ onDropButtonClick }}"
    onDragOver="{{ onDropButtonDragOver }}"
    onDrop="{{ onDropButtonDrop }}"
    style="height:72px;width:110px;font-size:16px;"
  >DROP</button>

  <button class="btn btn-primary" onClick="{{ print }}">Print / Save as PDF</button>
</div>

<div class="no-print" style="position:sticky;top:57px;z-index:19;display:flex;gap:var(--space-2,8px);flex-wrap:wrap;padding:var(--space-2,8px) var(--space-5,20px);background:var(--color-bg,#f2f2f3);border-bottom:1px solid var(--color-neutral-300,#ccc);">
  <sc-for list="{{ pages }}" as="p" hint-placeholder-count="1">
    <div style="position:relative;display:inline-block;">
      <button class="btn btn-secondary" onClick="{{ p.onScrollTo }}" style="width:100px;font-family:'Arial Narrow', Arial, sans-serif;">{{ p.tabLabel }}</button>
      <button class="btn btn-icon" onClick="{{ p.onRemove }}" title="Delete page" style="position:absolute;top:-8px;right:-8px;width:18px;height:18px;min-width:18px;padding:0;font-size:11px;line-height:1;">×</button>
    </div>
  </sc-for>
  <button class="btn btn-secondary" onClick="{{ addPage }}">+ Add page</button>
</div>

<x-import component-from-global-scope="doc-page" from="./doc-page.js" width="{{ pageWidthIn }}" height="{{ pageHeightIn }}" hint-size="100%,auto">
  <sc-for list="{{ pages }}" as="p" hint-placeholder-count="1">
    <section class="page" ref="{{ p.sectionRef }}" style="position:relative;">
      <sc-if value="{{ p.canRemove }}" hint-placeholder-val="{{ false }}">
        <button class="btn btn-icon no-print" style="position:absolute;top:8px;right:8px;z-index:5;" onClick="{{ p.onRemove }}" title="Remove page">×</button>
      </sc-if>
      <div
        class="editable"
        contentEditable="true"
        suppressContentEditableWarning="true"
        ref="{{ p.ref }}"
        onPaste="{{ p.onPaste }}"
        onInput="{{ p.onInput }}"
        onDragOver="{{ p.onDragOver }}"
        onDrop="{{ p.onDrop }}"
        style="height:100%;box-sizing:border-box;padding:1in;overflow:hidden;font-family:'Arial Narrow', Arial, sans-serif;font-size:14px;line-height:1.6;color:#1d1f20;background:#ffffff;"
      ></div>
    </section>
  </sc-for>
</x-import>

</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { pageIds: ['p1'], size: 'letter', orientation: 'portrait', docTitle: '', pageNumbers: { p1: 1 } };

  constructor(props) {
    super(props);
    this.pageCounter = 1;
    this.numberCounter = 1;
    this.editableEls = {};
    this.sectionEls = {};
    this.inputTimers = {};
  }

  scrollToPage(id) {
    const el = this.sectionEls[id];
    if (!el) return;
    const rect = el.getBoundingClientRect();
    window.scrollBy({ top: rect.top - 130, behavior: 'smooth' });
  }

  newId() { return 'p' + (++this.pageCounter); }

  getDims() {
    let w = this.state.size === 'tabloid' ? 11 : 8.5;
    let h = this.state.size === 'tabloid' ? 17 : 11;
    if (this.state.orientation === 'landscape') { const t = w; w = h; h = t; }
    return { w, h };
  }

  flowFrom(pageId, depth) {
    if (this._flowing) { this._flowQueued = this._flowQueued || new Set(); this._flowQueued.add(pageId); return; }
    this._flowing = true;
    this._flowLoop(pageId).finally(() => {
      this._flowing = false;
      if (this._flowQueued && this._flowQueued.size) {
        const next = [...this._flowQueued]; this._flowQueued.clear();
        next.forEach(id => this.flowFrom(id));
      }
    });
  }

  async _flowLoop(startId) {
    let curId = startId, iter = 0;
    while (iter < 20000) {
      const el = this.editableEls[curId];
      if (!el) return;
      if (el.scrollHeight <= el.clientHeight + 1) return;
      const idx = this.state.pageIds.indexOf(curId);
      let nextId = this.state.pageIds[idx + 1];
      if (!nextId) {
        nextId = this.newId();
        const num = ++this.numberCounter;
        await new Promise(resolve => this.setState(s => ({
          pageIds: [...s.pageIds, nextId],
          pageNumbers: { ...s.pageNumbers, [nextId]: num },
        }), resolve));
        await new Promise(r => requestAnimationFrame(() => requestAnimationFrame(r)));
      }
      const fromEl = this.editableEls[curId];
      const toEl = this.editableEls[nextId];
      if (!fromEl || !toEl) return;
      let movedAny = false;
      while (fromEl.scrollHeight > fromEl.clientHeight + 1 && fromEl.lastChild) {
        toEl.insertBefore(fromEl.lastChild, toEl.firstChild);
        movedAny = true;
        iter++;
        if (iter % 25 === 0) await new Promise(r => setTimeout(r, 0));
      }
      if (!movedAny) return;
      curId = nextId;
    }
  }

  handleInput(id) {
    clearTimeout(this.inputTimers[id]);
    this.inputTimers[id] = setTimeout(() => this.flowFrom(id), 500);
  }

  removePage(id) {
    if (this.state.pageIds.length <= 1) return;
    const idx = this.state.pageIds.indexOf(id);
    const targetId = this.state.pageIds[idx - 1] || this.state.pageIds[idx + 1];
    const el = this.editableEls[id];
    const targetEl = this.editableEls[targetId];
    if (el && targetEl) {
      while (el.firstChild) targetEl.appendChild(el.firstChild);
    }
    delete this.editableEls[id];
    this.setState(s => {
      const pageTitles = { ...s.pageTitles }; delete pageTitles[id];
      const pageNumbers = { ...s.pageNumbers }; delete pageNumbers[id];
      return { pageIds: s.pageIds.filter(x => x !== id), pageTitles, pageNumbers };
    }, () => {
      requestAnimationFrame(() => this.flowFrom(targetId));
    });
  }

  insertNodeAtSelection(el, node) {
    el.focus();
    const sel = window.getSelection();
    let range;
    if (sel && sel.rangeCount && el.contains(sel.anchorNode)) {
      range = sel.getRangeAt(0);
    } else {
      range = document.createRange();
      range.selectNodeContents(el);
      range.collapse(false);
    }
    range.deleteContents();
    range.insertNode(node);
    range.setStartAfter(node);
    range.collapse(true);
    sel.removeAllRanges();
    sel.addRange(range);
  }

  sanitizeHTML(html) {
    const doc = new DOMParser().parseFromString(html, 'text/html');
    const allowed = new Set(['B', 'STRONG', 'I', 'EM', 'U', 'P', 'BR', 'UL', 'OL', 'LI', 'SPAN', 'H1', 'H2', 'H3', 'A', 'IMG', 'DIV']);
    const walk = (node) => {
      [...node.childNodes].forEach(child => {
        if (child.nodeType === 1) {
          if (!allowed.has(child.tagName)) {
            while (child.firstChild) node.insertBefore(child.firstChild, child);
            node.removeChild(child);
            return;
          }
          [...child.attributes].forEach(attr => {
            if (attr.name.startsWith('on') || attr.name === 'class' || attr.name === 'id') child.removeAttribute(attr.name);
          });
          walk(child);
        } else if (child.nodeType === 8) {
          node.removeChild(child);
        }
      });
    };
    walk(doc.body);
    return doc.body.innerHTML;
  }

  insertHTML(pageId, html) {
    const el = this.editableEls[pageId];
    if (!el) return;
    el.focus();
    const sel = window.getSelection();
    let range;
    if (sel && sel.rangeCount && el.contains(sel.anchorNode)) range = sel.getRangeAt(0);
    else { range = document.createRange(); range.selectNodeContents(el); range.collapse(false); }
    range.deleteContents();
    const frag = range.createContextualFragment(html);
    const lastNode = frag.lastChild;
    range.insertNode(frag);
    if (lastNode) { range.setStartAfter(lastNode); range.collapse(true); sel.removeAllRanges(); sel.addRange(range); }
  }

  determineSizeOrientation(wIn, hIn) {
    const longIn = Math.max(wIn, hIn), shortIn = Math.min(wIn, hIn);
    const letterInteriorLong = 9, letterInteriorShort = 6.5;
    const size = (longIn > letterInteriorLong || shortIn > letterInteriorShort) ? 'tabloid' : this.state.size;
    const orientation = wIn > hIn ? 'landscape' : 'portrait';
    return { size, orientation };
  }

  insertImage(pageId, dataUrl) {
    const el = this.editableEls[pageId];
    if (!el) return;
    const img = new Image();
    img.onload = async () => {
      const wIn = img.naturalWidth / 96, hIn = img.naturalHeight / 96;
      const { size, orientation } = this.determineSizeOrientation(wIn, hIn);
      if (size !== this.state.size || orientation !== this.state.orientation) {
        await new Promise(resolve => this.setState({ size, orientation }, resolve));
        await new Promise(r => requestAnimationFrame(() => requestAnimationFrame(r)));
      }
      const elNow = this.editableEls[pageId] || el;
      const maxW = elNow.clientWidth || 400;
      const maxH = elNow.clientHeight || 500;
      let w = img.naturalWidth, h = img.naturalHeight;
      const scale = Math.min(1, maxW / w, maxH / h);
      w = Math.round(w * scale); h = Math.round(h * scale);
      const wrapper = document.createElement('div');
      wrapper.className = 'img-wrap';
      wrapper.contentEditable = false;
      wrapper.style.cssText = 'display:inline-block;resize:both;overflow:hidden;width:' + w + 'px;height:' + h + 'px;position:relative;margin:8px 4px;border:1px solid #ccc;vertical-align:top;';
      const imageEl = document.createElement('img');
      imageEl.src = dataUrl;
      imageEl.style.cssText = 'width:100%;height:100%;object-fit:fill;display:block;';
      wrapper.appendChild(imageEl);
      const badge = document.createElement('div');
      badge.className = 'no-print';
      badge.textContent = 'Original ' + img.naturalWidth + '×' + img.naturalHeight + 'px — drag corner to resize';
      badge.style.cssText = 'position:absolute;bottom:0;left:0;right:0;font-size:10px;background:rgba(29,31,32,0.7);color:#fff;padding:2px 4px;pointer-events:none;';
      wrapper.appendChild(badge);
      this.insertNodeAtSelection(elNow, wrapper);
      this.flowFrom(pageId);
    };
    img.src = dataUrl;
  }

  async onDropPDF(pageId, file) {
    if (window.pdfjsLib && window.pdfjsLib.GlobalWorkerOptions) {
      window.pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    }
    const buf = await file.arrayBuffer();
    const pdf = await window.pdfjsLib.getDocument({ data: buf }).promise;
    const firstPage = await pdf.getPage(1);
    const pv = firstPage.getViewport({ scale: 1 });
    const wIn = pv.width / 72, hIn = pv.height / 72;
    const longIn = Math.max(wIn, hIn), shortIn = Math.min(wIn, hIn);
    const size = Math.abs(longIn - 17) < Math.abs(longIn - 11) ? 'tabloid' : 'letter';
    const orientation = wIn > hIn ? 'landscape' : 'portrait';
    if (size !== this.state.size || orientation !== this.state.orientation) {
      await new Promise(resolve => this.setState({ size, orientation }, resolve));
      await new Promise(r => requestAnimationFrame(() => requestAnimationFrame(r)));
    }
    const el = this.editableEls[pageId];
    const targetW = (el ? el.clientWidth : 700) || 700;
    for (let i = 1; i <= pdf.numPages; i++) {
      const page = await pdf.getPage(i);
      const viewport = page.getViewport({ scale: 1 });
      const scale = (targetW * 2) / viewport.width; // 2x for print sharpness
      const scaledViewport = page.getViewport({ scale });
      const canvas = document.createElement('canvas');
      canvas.width = scaledViewport.width;
      canvas.height = scaledViewport.height;
      const ctx = canvas.getContext('2d');
      await page.render({ canvasContext: ctx, viewport: scaledViewport }).promise;
      this.insertImage(pageId, canvas.toDataURL('image/png'));
    }
  }

  targetPageId() {
    return this.state.pageIds[this.state.pageIds.length - 1];
  }

  handleFile(file) {
    const pageId = this.targetPageId();
    if (file.type === 'application/pdf') {
      this.onDropPDF(pageId, file);
    } else if (file.type.startsWith('image/')) {
      const reader = new FileReader();
      reader.onload = (ev) => this.insertImage(pageId, ev.target.result);
      reader.readAsDataURL(file);
    }
  }

  async handleUrl(url) {
    const pageId = this.targetPageId();
    if (/\.pdf(\?|#|$)/i.test(url)) {
      try {
        const res = await fetch(url);
        const blob = await res.blob();
        await this.onDropPDF(pageId, new File([blob], 'dropped.pdf', { type: 'application/pdf' }));
      } catch (err) {
        alert('Could not load that PDF URL (it may block cross-site access).');
      }
    } else {
      this.insertImage(pageId, url);
    }
  }

  onDropButtonClick() {
    const url = window.prompt('Paste an image or PDF URL, or leave blank to choose a file from your device:');
    if (url === null) return;
    if (url.trim()) this.handleUrl(url.trim());
    else if (this.fileInputEl) this.fileInputEl.click();
  }

  onDropButtonDragOver(e) {
    e.preventDefault();
  }

  onDropButtonDrop(e) {
    e.preventDefault();
    const files = e.dataTransfer && e.dataTransfer.files;
    if (files && files.length) {
      [...files].forEach(f => this.handleFile(f));
    } else {
      const url = e.dataTransfer.getData('text/uri-list') || e.dataTransfer.getData('text/plain');
      if (url) this.handleUrl(url);
    }
  }

  onFileChosen(e) {
    const files = e.target.files;
    if (files && files.length) [...files].forEach(f => this.handleFile(f));
    e.target.value = '';
  }

  onDragOver(e) {
    if (e.dataTransfer && [...e.dataTransfer.items].some(it => it.type === 'application/pdf')) {
      e.preventDefault();
    }
  }

  onDrop(e, pageId) {
    const file = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
    if (file && file.type === 'application/pdf') {
      e.preventDefault();
      this.onDropPDF(pageId, file);
    }
  }

  onPaste(e, pageId) {
    e.preventDefault();
    const items = e.clipboardData ? e.clipboardData.items : [];
    let handledImage = false;
    for (const item of items) {
      if (item.type && item.type.startsWith('image/')) {
        const file = item.getAsFile();
        if (file) {
          const reader = new FileReader();
          reader.onload = (ev) => this.insertImage(pageId, ev.target.result);
          reader.readAsDataURL(file);
          handledImage = true;
        }
      }
    }
    if (!handledImage) {
      const html = e.clipboardData.getData('text/html');
      const text = e.clipboardData.getData('text/plain');
      if (html) {
        this.insertHTML(pageId, this.sanitizeHTML(html));
      } else if (text) {
        const escaped = text.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/\n/g, '<br>');
        this.insertHTML(pageId, escaped);
      }
    }
    setTimeout(() => this.flowFrom(pageId), 50);
  }

  renderVals() {
    const dims = this.getDims();
    const activeStyle = 'background:var(--color-accent,#5980a6);color:#fff;';
    const inactiveStyle = 'background:transparent;color:var(--color-text,#1d1f20);';
    const pages = this.state.pageIds.map((id) => {
      const num = this.state.pageNumbers[id];
      return {
        id,
        canRemove: this.state.pageIds.length > 1,
        ref: (el) => { if (el) this.editableEls[id] = el; },
        sectionRef: (el) => { if (el) this.sectionEls[id] = el; },
        onPaste: (e) => this.onPaste(e, id),
        onInput: () => this.handleInput(id),
        onDragOver: (e) => this.onDragOver(e),
        onDrop: (e) => this.onDrop(e, id),
        onRemove: () => this.removePage(id),
        tabLabel: 'Page ' + num,
        onScrollTo: () => this.scrollToPage(id),
      };
    });
    return {
      pages,
      pageWidthIn: dims.w + 'in',
      pageHeightIn: dims.h + 'in',
      sizeLetterStyle: this.state.size === 'letter' ? activeStyle : inactiveStyle,
      sizeTabloidStyle: this.state.size === 'tabloid' ? activeStyle : inactiveStyle,
      orientPortraitStyle: this.state.orientation === 'portrait' ? activeStyle : inactiveStyle,
      orientLandscapeStyle: this.state.orientation === 'landscape' ? activeStyle : inactiveStyle,
      setSizeLetter: () => this.setState({ size: 'letter' }),
      setSizeTabloid: () => this.setState({ size: 'tabloid' }),
      setOrientationPortrait: () => this.setState({ orientation: 'portrait' }),
      setOrientationLandscape: () => this.setState({ orientation: 'landscape' }),
      addPage: () => {
        const id = this.newId();
        const num = ++this.numberCounter;
        this.setState(s => ({ pageIds: [...s.pageIds, id], pageNumbers: { ...s.pageNumbers, [id]: num } }));
      },
      docTitleValue: this.state.docTitle,
      onDocTitleChange: (e) => this.setState({ docTitle: e.target.value }),
      fileInputRef: (el) => { if (el) this.fileInputEl = el; },
      onFileChosen: (e) => this.onFileChosen(e),
      onDropButtonClick: () => this.onDropButtonClick(),
      onDropButtonDragOver: (e) => this.onDropButtonDragOver(e),
      onDropButtonDrop: (e) => this.onDropButtonDrop(e),
      print: () => {
        const title = (this.state.docTitle || 'DOC').trim() || 'DOC';
        const now = new Date();
        const pad = n => String(n).padStart(2, '0');
        const dateStr = now.getFullYear() + pad(now.getMonth() + 1) + pad(now.getDate());
        let hours = now.getHours();
        const ampm = hours >= 12 ? 'p' : 'a';
        hours = hours % 12 || 12;
        const timeStr = pad(hours) + pad(now.getMinutes()) + ampm;
        const prevTitle = document.title;
        document.title = title + '-' + dateStr + '-' + timeStr + 'h';
        window.print();
        setTimeout(() => { document.title = prevTitle; }, 1000);
      },
    };
  }
}
</script>
</body>
</html>
