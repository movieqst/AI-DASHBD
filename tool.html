<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tool Details</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 40px 20px;
        }
        .container { max-width: 900px; margin: 0 auto; }

        .back-btn {
            color: white;
            text-decoration: none;
            font-size: 1.1em;
            margin-bottom: 24px;
            display: inline-block;
            transition: opacity 0.3s;
            padding: 8px 0;
        }
        .back-btn:hover { opacity: 0.8; }

        .tool-card {
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 8px 32px rgba(0,0,0,0.15);
        }

        .tool-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 36px 32px;
            display: flex;
            align-items: center;
            gap: 24px;
        }
        .tool-icon { font-size: 3.5em; flex-shrink: 0; }
        .tool-title { flex: 1; }
        .tool-title h1 { margin-bottom: 8px; font-size: 1.8em; }
        .tool-title p { font-size: 1.05em; opacity: 0.9; line-height: 1.5; }

        .tool-body { padding: 36px 32px; }

        .rating-section {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 16px;
            margin-bottom: 28px;
        }
        .stat-box {
            background: #f4f5f7;
            padding: 18px 14px;
            border-radius: 8px;
            text-align: center;
        }
        .stat-box .stat-label {
            display: block;
            font-size: 0.75em;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #999;
            margin-bottom: 6px;
            font-weight: 600;
        }
        .stat-box .stat-value {
            display: block;
            font-size: 1.4em;
            font-weight: 700;
            color: #333;
        }

        .section { margin-bottom: 28px; }
        .section h2 {
            color: #667eea;
            margin-bottom: 12px;
            font-size: 1.35em;
            border-bottom: 2px solid #667eea;
            padding-bottom: 6px;
        }

        .overview {
            background: #f4f5f7;
            padding: 18px 20px;
            border-radius: 8px;
            line-height: 1.8;
            color: #333;
        }

        .list-section ul { list-style: none; padding: 0; }
        .list-section li {
            padding: 10px 0 10px 28px;
            position: relative;
            color: #333;
            line-height: 1.6;
            border-bottom: 1px solid #eee;
        }
        .list-section li:last-child { border-bottom: none; }
        .benefits li:before {
            content: '\2713';
            position: absolute;
            left: 0;
            color: #3fb950;
            font-weight: bold;
            font-size: 1.1em;
        }
        .drawbacks li:before {
            content: '\2717';
            position: absolute;
            left: 0;
            color: #ff6b6b;
            font-weight: bold;
            font-size: 1.1em;
        }

        .category-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 28px;
        }
        .category-tag {
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.9em;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .visit-btn {
            display: inline-block;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 14px 36px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            font-size: 1.05em;
            transition: transform 0.3s, box-shadow 0.3s;
        }
        .visit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 16px rgba(102, 126, 234, 0.4);
        }

        .loading {
            text-align: center;
            color: white;
            font-size: 1.3em;
            padding: 80px 20px;
        }
        .loading::after {
            content: '';
            display: block;
            width: 40px;
            height: 40px;
            border: 3px solid rgba(255,255,255,0.2);
            border-top-color: white;
            border-radius: 50%;
            margin: 16px auto 0;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        .error-msg {
            background: #ff6b6b;
            color: white;
            padding: 24px;
            border-radius: 10px;
            text-align: center;
            max-width: 500px;
            margin: 60px auto;
        }
        .error-msg strong { display: block; font-size: 1.3em; margin-bottom: 8px; }

        @media (max-width: 600px) {
            .tool-header { flex-direction: column; text-align: center; padding: 28px 20px; }
            .tool-body { padding: 24px 20px; }
            .tool-icon { font-size: 2.5em; }
            .tool-title h1 { font-size: 1.4em; }
        }
    </style>
</head>
<body>
    <div class="container">
        <a href="index.html" class="back-btn">&larr; Back to AI Tools</a>

        <div id="loading" class="loading">Loading tool details...</div>
        <div id="error" class="error-msg" style="display: none;"></div>
        <div id="content"></div>
    </div>

<script>
// Map spaced display names to slugs for filter matching
const categorySlugMap = {
  'voice ai': 'voice',
  'local ai': 'local',
  'architectural ai': 'architectural',
  'ai aggregator': 'aggregator'
};

const slugToDisplay = {
  chat: 'Chat AI',
  image: 'Image AI',
  video: 'Video AI',
  audio: 'Audio AI',
  code: 'Coding AI',
  supercomputer: 'Supercomputer',
  niche: 'Niche AI',
  notai: 'Not AI',
  voice: 'Voice AI',
  local: 'Local AI',
  architectural: 'Architectural AI',
  aggregator: 'AI Aggregator'
};

const categoryColors = {
  chat:  { accent: '#58a6ff', bg: 'rgba(88,166,255,0.15)',  color: '#58a6ff' },
  image: { accent: '#f0883e', bg: 'rgba(240,136,62,0.15)',  color: '#f0883e' },
  video: { accent: '#39c5cf', bg: 'rgba(57,197,207,0.15)',  color: '#39c5cf' },
  audio: { accent: '#a371f7', bg: 'rgba(163,113,247,0.15)', color: '#a371f7' },
  code:  { accent: '#3fb950', bg: 'rgba(63,185,80,0.15)',   color: '#3fb950' },
  supercomputer: { accent: '#ff2d78', bg: 'rgba(255,45,120,0.15)', color: '#ff2d78' },
  niche: { accent: '#d29922', bg: 'rgba(210,153,34,0.15)',  color: '#d29922' },
  notai: { accent: '#8b949e', bg: 'rgba(139,148,158,0.15)', color: '#8b949e' },
  voice: { accent: '#ff9bce', bg: 'rgba(255,155,206,0.15)', color: '#ff9bce' },
  local: { accent: '#f85149', bg: 'rgba(248,81,73,0.15)',   color: '#f85149' },
  architectural: { accent: '#7ee787', bg: 'rgba(126,231,135,0.15)', color: '#7ee787' },
  aggregator: { accent: '#ffcc66', bg: 'rgba(255,204,102,0.15)', color: '#ffcc66' }
};

function normalizeCategory(cat) {
  if (!cat) return '';
  const lower = cat.toLowerCase().trim();
  return categorySlugMap[lower] || lower.replace(/\s+/g, '-').replace(/[^a-z0-9-]/g, '');
}

function getDisplayCat(slug) {
  return slugToDisplay[slug] || slug;
}

function slugifyName(name) {
  return name.toLowerCase().trim().replace(/[^a-z0-9]+/g, '-').replace(/(^-|-$)/g, '');
}

function formatTraffic(n) {
  if (typeof n !== 'number') return 'N/A';
  if (n >= 1000000) return (n / 1000000).toFixed(n % 1000000 === 0 ? 0 : 1) + 'M';
  if (n >= 1000) return Math.round(n / 1000) + 'K';
  return String(n);
}

function escapeHtml(str) {
  if (str == null) return '';
  return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

async function loadToolDetails() {
  const params = new URLSearchParams(window.location.search);
  const rawId = params.get('id');
  const rawSlug = params.get('slug');

  if (!rawId && !rawSlug) {
    showError('No tool specified. Please use a link from the AI dashboard.');
    return;
  }

  // Load all three data parts using Promise.allSettled so one missing doesn't kill the page
  const parts = await Promise.allSettled([
    fetch('data-part1.json').then(r => { if (!r.ok) throw new Error('part1'); return r.json(); }),
    fetch('data-part2.json').then(r => { if (!r.ok) throw new Error('part2'); return r.json(); }),
    fetch('data-part3.json').then(r => { if (!r.ok) throw new Error('part3'); return r.json(); })
  ]);

  const loadErrors = [];
  const allTools = [];
  parts.forEach((result, idx) => {
    if (result.status === 'fulfilled') {
      allTools.push.apply(allTools, result.value);
    } else {
      loadErrors.push('data-part' + (idx + 1) + '.json');
    }
  });

  if (allTools.length === 0) {
    showError('Could not load data files (' + loadErrors.join(', ') + '). Please ensure data-part1.json, data-part2.json, and data-part3.json are present.');
    return;
  }

  let tool = null;
  const searchId = (rawId || rawSlug || '').trim();

  // 1. Try exact name match (case-insensitive) — primary path via ?id=
  if (rawId) {
    tool = allTools.find(t => t.name.toLowerCase() === searchId.toLowerCase());
  }

  // 2. Fall back to slugified name match — for ?slug= and any hyphened id variants
  if (!tool && searchId) {
    tool = allTools.find(t => slugifyName(t.name) === slugifyName(searchId));
  }

  // 3. Last resort: partial name match (searchId is substring of tool name)
  if (!tool && searchId && searchId.length > 3) {
    tool = allTools.find(t => t.name.toLowerCase().includes(searchId.toLowerCase()));
  }

  if (!tool) {
    showError('Tool not found: "' + escapeHtml(searchId) + '". (' + allTools.length + ' tools loaded from data-part1/2/3.json)');
    return;
  }

  displayTool(tool);
}

function showError(msg) {
  document.getElementById('loading').style.display = 'none';
  const errEl = document.getElementById('error');
  errEl.style.display = 'block';
  errEl.innerHTML = '<strong>Error</strong>' + msg;
}

function displayTool(tool) {
  document.getElementById('loading').style.display = 'none';

  const ratingFull = tool.rating || 0;
  const ratingHalf = Math.round(ratingFull / 2);
  const stars = '\u2605'.repeat(ratingHalf) + '\u2606'.repeat(5 - ratingHalf);
  const trafficFormatted = formatTraffic(tool.traffic);

  // Build category tag pills
  const catPills = tool.categories.map(cat => {
    const slug = normalizeCategory(cat);
    const display = getDisplayCat(slug);
    const colorSet = categoryColors[slug] || categoryColors.chat;
    return '<span class="category-tag" style="background:' + colorSet.bg + ';color:' + colorSet.color + ';border:1px solid ' + colorSet.accent + '">' + escapeHtml(display) + '</span>';
  }).join('');

  // Build benefits list
  let benefitsHtml = '';
  if (tool.benefits && tool.benefits.length > 0) {
    benefitsHtml = '<div class="section list-section benefits"><h2>Benefits</h2><ul>' +
      tool.benefits.map(b => '<li>' + escapeHtml(b) + '</li>').join('') +
      '</ul></div>';
  }

  // Build drawbacks list
  let drawbacksHtml = '';
  if (tool.drawbacks && tool.drawbacks.length > 0) {
    drawbacksHtml = '<div class="section list-section drawbacks"><h2>Drawbacks</h2><ul>' +
      tool.drawbacks.map(d => '<li>' + escapeHtml(d) + '</li>').join('') +
      '</ul></div>';
  }

  // Overview section
  let overviewHtml = '';
  if (tool.overview) {
    overviewHtml = '<div class="section"><h2>Overview</h2><div class="overview">' + escapeHtml(tool.overview) + '</div></div>';
  }

  const content = document.getElementById('content');
  content.innerHTML = '<div class="tool-card">' +
    '<div class="tool-header">' +
      '<div class="tool-icon">' + (tool.icon || '\u2699') + '</div>' +
      '<div class="tool-title">' +
        '<h1>' + escapeHtml(tool.name) + '</h1>' +
        '<p>' + escapeHtml(tool.desc || '') + '</p>' +
      '</div>' +
    '</div>' +

    '<div class="tool-body">' +
      '<div class="category-tags">' + catPills + '</div>' +

      '<div class="rating-section">' +
        '<div class="stat-box">' +
          '<span class="stat-label">Rating</span>' +
          '<span class="stat-value">' + ratingFull + '/10</span>' +
        '</div>' +
        '<div class="stat-box">' +
          '<span class="stat-label">Daily Traffic</span>' +
          '<span class="stat-value">' + trafficFormatted + '</span>' +
        '</div>' +
        '<div class="stat-box">' +
          '<span class="stat-label">Pricing</span>' +
          '<span class="stat-value">' + (tool.free ? 'Free' : 'Paid') + '</span>' +
        '</div>' +
        '<div class="stat-box">' +
          '<span class="stat-label">Affiliate</span>' +
          '<span class="stat-value">' + (tool.affiliate ? 'Yes' : 'No') + '</span>' +
        '</div>' +
      '</div>' +

      overviewHtml +
      benefitsHtml +
      drawbacksHtml +

      '<div class="section">' +
        '<a href="' + escapeHtml(tool.url || '#') + '" target="_blank" rel="noopener" class="visit-btn">Visit ' + escapeHtml(tool.name) + ' \u2192</a>' +
      '</div>' +
    '</div>' +
  '</div>';
}

loadToolDetails();
</script>

</body>
</html>
