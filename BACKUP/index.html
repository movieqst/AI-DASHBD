<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Tools Database</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 40px 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        .header {
            text-align: center;
            color: white;
            margin-bottom: 40px;
        }
        
        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }
        
        .header p {
            font-size: 1.1em;
            opacity: 0.9;
        }
        
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }
        
        .card {
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s, box-shadow 0.3s;
            cursor: pointer;
        }
        
        .card:hover {
            transform: translateY(-8px);
            box-shadow: 0 12px 20px rgba(0, 0, 0, 0.15);
        }
        
        .card-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            display: flex;
            align-items: center;
            gap: 15px;
        }
        
        .card-icon {
            font-size: 2.5em;
        }
        
        .card-title {
            flex: 1;
        }
        
        .card-title h3 {
            margin-bottom: 5px;
        }
        
        .card-title p {
            font-size: 0.85em;
            opacity: 0.9;
        }
        
        .card-body {
            padding: 20px;
        }
        
        .rating {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 10px;
            font-weight: bold;
            color: #667eea;
        }
        
        .stars {
            color: #ffd700;
        }
        
        .stats {
            display: flex;
            gap: 15px;
            margin-bottom: 15px;
            font-size: 0.9em;
            color: #666;
        }
        
        .stat {
            display: flex;
            align-items: center;
            gap: 5px;
        }
        
        .categories {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 15px;
        }
        
        .category-tag {
            background: #f0f0f0;
            color: #333;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.8em;
            font-weight: 500;
        }
        
        .card-link {
            display: inline-block;
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
            transition: color 0.3s;
        }
        
        .card-link:hover {
            color: #764ba2;
            text-decoration: underline;
        }
        
        .loading {
            text-align: center;
            color: white;
            font-size: 1.2em;
            padding: 40px;
        }
        
        .error {
            background: #ff6b6b;
            color: white;
            padding: 20px;
            border-radius: 8px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🤖 AI Tools Database</h1>
            <p>Explore the latest AI tools and platforms</p>
        </div>
        
        <div id="loading" class="loading">Loading tools...</div>
        <div id="error" class="error" style="display: none;"></div>
        <div id="grid" class="grid"></div>
    </div>
    
    <script>
        let allTools = [];
        
        async function loadAllTools() {
            try {
                const parts = [1, 2, 3]; // Load 3 parts instead of 5
                const promises = parts.map(i => 
                    fetch(`data-part${i}.json`).then(res => res.json())
                );
                
                const results = await Promise.all(promises);
                allTools = results.flat();
                
                displayTools(allTools);
                document.getElementById('loading').style.display = 'none';
            } catch (error) {
                console.error('Error loading tools:', error);
                document.getElementById('loading').style.display = 'none';
                document.getElementById('error').style.display = 'block';
                document.getElementById('error').textContent = '❌ Failed to load tools. Make sure all data files are in the same directory.';
            }
        }
        
        function displayTools(tools) {
            const grid = document.getElementById('grid');
            grid.innerHTML = '';
            
            tools.forEach(tool => {
                const card = document.createElement('div');
                card.className = 'card';
                card.onclick = () => window.location.href = `tool.html?id=${tool.name.replace(/\s+/g, '-').toLowerCase()}`;
                
                const ratingStars = '⭐'.repeat(Math.round(tool.rating / 2));
                const trafficM = (tool.traffic / 1000000).toFixed(1);
                
                card.innerHTML = `
                    <div class="card-header">
                        <div class="card-icon">${tool.icon}</div>
                        <div class="card-title">
                            <h3>${tool.name}</h3>
                            <p>${tool.desc}</p>
                        </div>
                    </div>
                    <div class="card-body">
                        <div class="rating">
                            <span class="stars">${ratingStars}</span>
                            <span>${tool.rating.toFixed(1)}/10</span>
                        </div>
                        <div class="stats">
                            <div class="stat">📊 ${trafficM}M traffic</div>
                            <div class="stat">${tool.free ? '✅ Free' : '💰 Paid'}</div>
                        </div>
                        <div class="categories">
                            ${tool.categories.map(cat => `<span class="category-tag">${cat}</span>`).join('')}
                        </div>
                        <a href="${tool.url}" target="_blank" class="card-link">Visit →</a>
                    </div>
                `;
                
                grid.appendChild(card);
            });
        }
        
        loadAllTools();
    </script>
</body>
</html>
