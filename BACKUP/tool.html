<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tool Details</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 40px 20px;
        }
        
        .container {
            max-width: 900px;
            margin: 0 auto;
        }
        
        .back-btn {
            color: white;
            text-decoration: none;
            font-size: 1.2em;
            margin-bottom: 30px;
            display: inline-block;
            transition: opacity 0.3s;
        }
        
        .back-btn:hover {
            opacity: 0.8;
        }
        
        .tool-card {
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
        }
        
        .tool-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 40px;
            display: flex;
            align-items: center;
            gap: 30px;
        }
        
        .tool-icon {
            font-size: 4em;
        }
        
        .tool-title {
            flex: 1;
        }
        
        .tool-title h1 {
            margin-bottom: 10px;
        }
        
        .tool-title p {
            font-size: 1.1em;
            opacity: 0.9;
        }
        
        .tool-body {
            padding: 40px;
        }
        
        .section {
            margin-bottom: 30px;
        }
        
        .section h2 {
            color: #667eea;
            margin-bottom: 15px;
            font-size: 1.5em;
        }
        
        .rating-section {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .stat-box {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 8px;
            text-align: center;
        }
        
        .stat-box h3 {
            color: #667eea;
            font-size: 1.2em;
            margin-bottom: 10px;
        }
        
        .stat-box p {
            color: #666;
        }
        
        .overview {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 8px;
            line-height: 1.8;
            color: #333;
        }
        
        .list-section ul {
            list-style: none;
            padding-left: 0;
        }
        
        .list-section li {
            padding: 12px 0;
            padding-left: 30px;
            position: relative;
            color: #333;
            line-height: 1.6;
        }
        
        .list-section li:before {
            content: "✓";
            position: absolute;
            left: 0;
            color: #667eea;
            font-weight: bold;
        }
        
        .drawbacks li:before {
            content: "✗";
            color: #ff6b6b;
        }
        
        .visit-btn {
            display: inline-block;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 15px 40px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            transition: transform 0.3s, box-shadow 0.3s;
        }
        
        .visit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 16px rgba(102, 126, 234, 0.4);
        }
        
        .loading {
            text-align: center;
            color: white;
            font-size: 1.2em;
            padding: 40px;
        }
        
        .error {
            background: #ff6b6b;
            color: white;
            padding: 20px;
            border-radius: 8px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="container">
        <a href="index.html" class="back-btn">← Back to Tools</a>
        
        <div id="loading" class="loading">Loading tool details...</div>
        <div id="error" class="error" style="display: none;"></div>
        <div id="content"></div>
    </div>
    
    <script>
        async function loadToolDetails() {
            try {
                const toolName = new URLSearchParams(window.location.search).get('id');
                if (!toolName) throw new Error('No tool specified');
                
                // Load all 3 parts and search for the tool
                const parts = [1, 2, 3];
                let tool = null;
                
                for (const partNum of parts) {
                    const res = await fetch(`data-part${partNum}.json`);
                    const tools = await res.json();
                    tool = tools.find(t => t.name.replace(/\s+/g, '-').toLowerCase() === toolName);
                    if (tool) break;
                }
                
                if (!tool) throw new Error('Tool not found');
                
                displayTool(tool);
                document.getElementById('loading').style.display = 'none';
            } catch (error) {
                console.error('Error:', error);
                document.getElementById('loading').style.display = 'none';
                document.getElementById('error').style.display = 'block';
                document.getElementById('error').textContent = '❌ ' + error.message;
            }
        }
        
        function displayTool(tool) {
            const ratingStars = '⭐'.repeat(Math.round(tool.rating / 2));
            const trafficM = (tool.traffic / 1000000).toFixed(1);
            
            const content = document.getElementById('content');
            content.innerHTML = `
                <div class="tool-card">
                    <div class="tool-header">
                        <div class="tool-icon">${tool.icon}</div>
                        <div class="tool-title">
                            <h1>${tool.name}</h1>
                            <p>${tool.desc}</p>
                        </div>
                    </div>
                    
                    <div class="tool-body">
                        <div class="rating-section">
                            <div class="stat-box">
                                <h3>${ratingStars}</h3>
                                <p>Rating: ${tool.rating.toFixed(1)}/10</p>
                            </div>
                            <div class="stat-box">
                                <h3>📊</h3>
                                <p>Traffic: ${trafficM}M</p>
                            </div>
                            <div class="stat-box">
                                <h3>${tool.free ? '✅' : '💰'}</h3>
                                <p>${tool.free ? 'Free' : 'Paid'}</p>
                            </div>
                        </div>
                        
                        ${tool.overview ? `
                        <div class="section">
                            <h2>Overview</h2>
                            <div class="overview">${tool.overview}</div>
                        </div>
                        ` : ''}
                        
                        ${tool.benefits && tool.benefits.length > 0 ? `
                        <div class="section list-section">
                            <h2>✓ Benefits</h2>
                            <ul>
                                ${tool.benefits.map(b => `<li>${b}</li>`).join('')}
                            </ul>
                        </div>
                        ` : ''}
                        
                        ${tool.drawbacks && tool.drawbacks.length > 0 ? `
                        <div class="section list-section drawbacks">
                            <h2>Drawbacks</h2>
                            <ul>
                                ${tool.drawbacks.map(d => `<li>${d}</li>`).join('')}
                            </ul>
                        </div>
                        ` : ''}
                        
                        <div class="section">
                            <a href="${tool.url}" target="_blank" class="visit-btn">Visit ${tool.name} →</a>
                        </div>
                    </div>
                </div>
            `;
        }
        
        loadToolDetails();
    </script>
</body>
</html>
